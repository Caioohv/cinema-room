services:
  db:
    image: postgres:16
    container_name: cinema-db
    environment:
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: cinema
      POSTGRES_DB: cinema
    ports:
      - "5433:5432"
    command:
      - "postgres"
      - "-c"
      - "log_lock_waits=on"
      - "-c"
      - "deadlock_timeout=1s"
      - "-c"
      - "log_min_duration_statement=200"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinema -d cinema"]
      interval: 5s
      timeout: 2s
      retries: 3

  redis:
    image: redis:7
    container_name: cinema-redis
    ports:
      - "6380:6379"
    command:
      - "redis-server"
      - "--notify-keyspace-events"
      - "Ex"
      - "--appendonly"
      - "no"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 3